name: stdy4u
description: "A production-ready student productivity tool with local persistence."
publish_to: "none"

version: 2.0.2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  solar_icons: ^0.1.0

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  flutter_markdown: ^0.7.6

  # Onboarding
  parallax_onboarding: ^0.1.0

  # App Usage Stats
  app_usage: ^4.1.0

  # Battery Optimization
  disable_battery_optimization: ^1.1.2

  # Data & Persistence
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.2
  intl: ^0.19.0
  just_audio: ^0.9.39

  # Calendar
  table_calendar: ^3.1.2

  # System & Logic
  flutter_local_notifications: ^17.1.2
  flutter_vibrate: ^1.4.0
  uuid: ^4.4.0
  url_launcher: ^6.2.6
  file_picker: ^8.0.3
  package_info_plus: ^8.0.0
  http: ^1.2.0
  open_filex: ^4.7.0
  timezone: ^0.9.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.9
  hive_generator: ^2.0.1
  riverpod_generator: ^2.4.0


flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/