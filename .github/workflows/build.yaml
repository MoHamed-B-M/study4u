name: Build & Release APK

on:
  push:
    branches:
      - main
      - beta
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  IS_BETA: ${{ github.ref == 'refs/heads/beta' }}
  IS_MAIN: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true' || env.IS_MAIN == 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ENCODED_KEYSTORE" ]; then
            echo "ERROR: KEYSTORE_BASE64 secret is missing — cannot produce a signed assembleRelease APK"
            exit 1
          fi
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > android/upload-keystore.jks 2>/dev/null || true
          if [ ! -s android/upload-keystore.jks ]; then
            echo "ERROR: decoded keystore is empty — cannot produce a signed assembleRelease APK"
            exit 1
          fi
          echo "Keystore decoded ($(wc -c < android/upload-keystore.jks) bytes)"

      - name: Convert keystore to compatible format
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true' || env.IS_MAIN == 'true'
        run: |
          keytool -importkeystore \
            -srckeystore android/upload-keystore.jks \
            -destkeystore android/upload-keystore-converted.jks \
            -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -deststorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -srcalias "${{ secrets.KEY_ALIAS }}" \
            -destalias "${{ secrets.KEY_ALIAS }}" \
            -srckeypass "${{ secrets.KEY_PASSWORD }}" \
            -destkeypass "${{ secrets.KEY_PASSWORD }}" \
            -deststoretype JKS \
            -noprompt 2>&1
          mv android/upload-keystore-converted.jks android/upload-keystore.jks

      - name: Create key.properties
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true' || env.IS_MAIN == 'true'
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Extract version from pubspec (beta / main)
        if: env.IS_BETA == 'true' || env.IS_MAIN == 'true'
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "pubspec version: $VERSION"

      - name: Extract version from tag
        if: env.IS_RELEASE == 'true'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update pubspec version (tag release)
        if: env.IS_RELEASE == 'true'
        run: |
          sed -i "s/version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml

      # Single signed universal APK == Gradle assembleRelease.
      # (flutter build apk --release invokes assembleRelease with the
      #  release signingConfig from android/key.properties above.)
      - name: Build signed release APK (assembleRelease)
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --split-debug-info=build/debug-info
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Verify APK signature (best-effort)
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true' || env.IS_MAIN == 'true'
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | head -n 1)
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs build/app/outputs/flutter-apk/app-release.apk | head -n 5
          else
            echo "apksigner not found — skipping signature printout"
          fi

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stdy4u-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload debug symbols
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true' || env.IS_MAIN == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stdy4u-debug-info-${{ github.run_number }}
          path: build/debug-info/
          retention-days: 30

      - name: Extract release notes from CHANGELOG
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true' || env.IS_MAIN == 'true'
        run: |
          awk '
            /^## \['"$VERSION"'\]/ { found=1; print; next }
            found { print }
            /^## \[/ && found { exit }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG entry found for version $VERSION — using auto-generated notes."
            echo "" > release_notes.md
          fi

      # ---- tag push vX.Y.Z -> versioned stable release (unchanged behaviour) ----
      - name: Create GitHub Release (tag)
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: stdy4u ${{ github.ref_name }}
          body_path: release_notes.md
          prerelease: false
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk

      # ---- beta branch -> signed pre-release, unique tag per run ----
      - name: Create GitHub Pre-release (beta)
        if: env.IS_BETA == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-beta.${{ github.run_number }}
          name: "stdy4u v${{ env.VERSION }} Beta (${{ github.run_number }})"
          body_path: release_notes.md
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk

      # Auto-delete older beta pre-releases so only the latest beta survives.
      # Runs AFTER the new pre-release is created, keeping the current tag.
      - name: Delete older beta pre-releases
        if: env.IS_BETA == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CURRENT="v${{ env.VERSION }}-beta.${{ github.run_number }}"
          echo "Keeping $CURRENT — deleting older beta pre-releases..."
          gh release list --limit 100 --json tagName,isPrerelease \
            --jq '.[] | select(.isPrerelease == true) | .tagName' | while read -r TAG; do
            if [ -z "$TAG" ]; then continue; fi
            if [ "$TAG" = "$CURRENT" ]; then continue; fi
            case "$TAG" in
              *-beta.*)
                echo "Deleting pre-release $TAG..."
                gh release delete "$TAG" --cleanup-tag -y || true
                ;;
            esac
          done
          echo "Pruning orphan beta tags (no release attached)..."
          git fetch --tags --quiet || true
          git tag --list 'v*-beta.*' | while read -r TAG; do
            if [ -z "$TAG" ]; then continue; fi
            if [ "$TAG" = "$CURRENT" ]; then continue; fi
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              echo "Deleting orphan tag $TAG..."
              git push origin ":refs/tags/$TAG" || true
            fi
          done

      # ---- main branch -> normal (stable, non-prerelease) release ----
      # Rolling tag vVERSION: re-pushing main on the same version updates
      # the same release instead of spamming new tags.
      - name: Create GitHub Release (main)
        if: env.IS_MAIN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: stdy4u v${{ env.VERSION }}
          body_path: release_notes.md
          prerelease: false
          make_latest: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk
