name: Build & Release APK

on:
  push:
    branches:
      - main
      - beta
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
  IS_BETA: ${{ github.ref_name == 'beta' }}

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$ENCODED_KEYSTORE" | base64 --decode > android/upload-keystore.jks 2>/dev/null || true
          if [ ! -s android/upload-keystore.jks ]; then
            echo "WARNING: decoded keystore is empty — skipping signed build"
            echo "EMPTY_KEYSTORE=true" >> $GITHUB_ENV
          else
            echo "Keystore decoded ($(wc -c < android/upload-keystore.jks) bytes)"
          fi

      - name: Convert keystore to compatible format
        if: (env.IS_RELEASE == 'true' || env.IS_BETA == 'true') && env.EMPTY_KEYSTORE != 'true'
        run: |
          keytool -importkeystore \
            -srckeystore android/upload-keystore.jks \
            -destkeystore android/upload-keystore-converted.jks \
            -srcstorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -deststorepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -srcalias "${{ secrets.KEY_ALIAS }}" \
            -destalias "${{ secrets.KEY_ALIAS }}" \
            -srckeypass "${{ secrets.KEY_PASSWORD }}" \
            -destkeypass "${{ secrets.KEY_PASSWORD }}" \
            -deststoretype JKS \
            -noprompt 2>&1
          mv android/upload-keystore-converted.jks android/upload-keystore.jks

      - name: Create key.properties
        if: (env.IS_RELEASE == 'true' || env.IS_BETA == 'true') && env.EMPTY_KEYSTORE != 'true'
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Extract version from pubspec
        if: env.IS_BETA == 'true'
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Extract version from tag
        if: env.IS_RELEASE == 'true'
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update pubspec version (release)
        if: env.IS_RELEASE == 'true'
        run: |
          sed -i "s/version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml

      - name: Build split APKs
        run: |
          EXTRA=""
          if [ "$IS_RELEASE" = "true" ] || [ "$IS_BETA" = "true" ]; then
            EXTRA="--build-number=${{ github.run_number }}"
          fi
          flutter build apk --release \
            --split-per-abi \
            --split-debug-info=build/debug-info \
            $EXTRA

      - name: Upload split APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stdy4u-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30

      - name: Upload debug symbols
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stdy4u-debug-info
          path: build/debug-info/
          retention-days: 30

      - name: Extract release notes from CHANGELOG
        if: env.IS_RELEASE == 'true' || env.IS_BETA == 'true'
        run: |
          awk '
            /^## \['"$VERSION"'\]/ { found=1; print; next }
            found { print }
            /^## \[/ && found { exit }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "No CHANGELOG entry found for version $VERSION — using auto-generated notes."
            echo "" > release_notes.md
          fi

      - name: Create GitHub Release
        if: env.IS_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: stdy4u ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk

      - name: Create GitHub Pre-release
        if: env.IS_BETA == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}-beta.${{ github.run_number }}
          name: "stdy4u v${{ env.VERSION }} Beta (${{ github.run_number }})"
          body_path: release_notes.md
          prerelease: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
