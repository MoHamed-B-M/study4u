name: Build & Release APK

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+" # Triggers exactly on vx.x.x semantic versioning formats (e.g., v1.0.4)
  workflow_dispatch:

jobs:
  build:
    name: Build and Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Decode keystore
        run: |
          printf '%s' "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/upload-keystore.jks
          if [ ! -s android/upload-keystore.jks ]; then
            echo "ERROR: decoded keystore is empty — check that KEY_STORE_BASE64 secret is set"
            exit 1
          fi
          echo "Keystore decoded ($(wc -c < android/upload-keystore.jks) bytes)"

      - name: Convert keystore to compatible format
        run: |
          keytool -importkeystore \
            -srckeystore android/upload-keystore.jks \
            -destkeystore android/upload-keystore.jks \
            -srcstorepass "${{ secrets.STORE_PASSWORD }}" \
            -deststorepass "${{ secrets.STORE_PASSWORD }}" \
            -srcalias "${{ secrets.KEY_ALIAS }}" \
            -destalias "${{ secrets.KEY_ALIAS }}" \
            -srckeypass "${{ secrets.KEY_PASSWORD }}" \
            -destkeypass "${{ secrets.KEY_PASSWORD }}" \
            -deststoretype JKS \
            -noprompt 2>&1

      - name: Verify keystore
        run: |
          keytool -list -keystore android/upload-keystore.jks \
            -storepass "${{ secrets.STORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" \
            -keypass "${{ secrets.KEY_PASSWORD }}" \
            -noprompt

      - name: Create key.properties
        run: |
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties

      - name: Extract version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV

      - name: Update pubspec version
        run: |
          sed -i "s/version: .*/version: $VERSION+${{ github.run_number }}/" pubspec.yaml
          echo "Updated to version: $(grep 'version:' pubspec.yaml)"

      - name: Build release APK
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: stdy4u ${{ github.ref_name }}
          generate_release_notes: true # Auto-generates release notes using Pull Requests and Commits
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk