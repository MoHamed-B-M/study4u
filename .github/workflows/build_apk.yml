name: Build Release APK

on:
  push:
    tags:
      - "v*.*.*"
    branches:
      - main
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      # ====================== FIX FOR UPDATE PROBLEM ======================
      - name: Extract version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_ENV
          echo "Building version: ${{ env.VERSION }}"

      - name: Update version in pubspec.yaml
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          sed -i "s/version: .*/version: ${{ env.VERSION }}/" pubspec.yaml
          echo "Updated pubspec version to:"
          grep "version:" pubspec.yaml

      # ===================================================================

      # ==================== ADDED SIGNING CONFIGURATION ====================
      - name: Decode Keystore
        run: echo "${{ secrets.KEY_STORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.STORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=upload-keystore.jks" >> android/key.properties
      # ===================================================================

      - name: Build Release APK
        run: flutter build apk --release --split-per-abi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stdy4u-release-apks
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30

      - name: Show APK sizes
        run: |
          echo "APK Sizes:"
          ls -lh build/app/outputs/flutter-apk/